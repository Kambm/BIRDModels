[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-project"
version = "0.1.0"
description = "Reproducible neural and local analytical diffusion experiments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["torch>=2.6", "torchvision>=0.21", "numpy>=1.24", "matplotlib>=3.7", "pillow>=9"]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "nbformat"]

[tool.setuptools.packages.find]
include = ["diffusion_project*"]
